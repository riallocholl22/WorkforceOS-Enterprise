name: Frontend QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    env:
      CI: true
      ENVIRONMENT: development
      DEV_BOOTSTRAP_ENABLED: true
      FRONTEND_URL: http://127.0.0.1:5500
      API_BASE: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install frontend QA dependencies
        run: npm install

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Run browser regression
        run: npm run test:frontend:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/playwright-report

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: test-results/artifacts
